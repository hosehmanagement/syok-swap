name: deploy texture pass to my Modal
# Run this in YOUR OWN copy (fork) of this repo. It puts the small CPU-only texture-pass endpoint in YOUR Modal account,
# so Modal bills you, not anyone else. Needs two repository secrets: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (see docs/TEXTURE.md).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Check the two secrets exist
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET under Settings > Secrets and variables > Actions. See docs/TEXTURE.md."
            exit 1
          fi
      - run: pip install modal
      - name: Deploy
        run: modal deploy texture_app.py 2>&1 | tee deploy.log
      - name: Show the endpoint address
        run: |
          url=$(grep -o 'https://[A-Za-z0-9._-]*\.modal\.run' deploy.log | head -1)
          echo "Endpoint address: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          test -n "$url"
